<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escribe tu nombre</title>
<meta name="description" content="Escribe tu nombre y mira en qué animal de estrellas se convierte. Cada nombre da siempre el mismo animal.">
<meta name="theme-color" content="#060a1c">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://nombre.appsandfun.com/">
<link rel="stylesheet" href="../style.css">
<script data-analytics-diagnostic>
// Temporary in-page observation of the official beacon's real requests.
// This does not create analytics events or read submitted names.
(() => {
  if (new URLSearchParams(location.search).get('analitica') !== 'prueba') return;
  const lines = ['Prueba del contador (tráfico propio)', new Date().toISOString()];
  let panel;
  const log = message => {
    lines.push(message);
    if (panel) panel.textContent = lines.join('\n');
  };
  document.addEventListener('DOMContentLoaded', () => {
    panel = document.createElement('pre');
    panel.id = 'analytics-diagnostic';
    panel.setAttribute('role', 'status');
    panel.style.cssText = 'position:fixed;inset:8px 8px auto;z-index:99999;white-space:pre-wrap;background:#fff;color:#111;padding:16px;font:14px/1.5 monospace;max-height:48vh;overflow:auto;border:3px solid #146c43';
    document.body.append(panel);
    panel.textContent = lines.join('\n');
  });
  const originalOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(method, url, ...rest) {
    const target = String(url);
    const result = originalOpen.call(this, method, url, ...rest);
    if (target.includes('/cdn-cgi/rum')) {
      log('Medición oficial: ' + method + ' ' + target);
      this.addEventListener('loadend', () => log('Respuesta de medición: HTTP ' + this.status));
    }
    return result;
  };
  const originalSendBeacon = navigator.sendBeacon.bind(navigator);
  navigator.sendBeacon = function(url, body) {
    const result = originalSendBeacon(url, body);
    if (String(url).includes('/cdn-cgi/rum')) log('Medición al salir: ' + (result ? 'en cola' : 'rechazada'));
    return result;
  };
  window.addEventListener('error', event => {
    const resource = event.target && event.target.src;
    log(resource ? 'Error de recurso: ' + resource : 'Error JavaScript: ' + event.message);
  }, true);
  window.addEventListener('unhandledrejection', event => log('Promesa rechazada: ' + String(event.reason)));
  window.addEventListener('load', () => log('Carga de página terminada'));
})();

</script>
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token":"13e4f376f1a8451d85dda26f7a081adc"}'></script>
</head>
<body>
<canvas id="cielo" aria-hidden="true"></canvas>
<main>
  <h1 class="sr">Escribe tu nombre y mira en qué se convierte</h1>
  <form id="formulario" autocomplete="off">
    <label for="nombre">Escribe tu nombre</label>
    <div class="campo">
      <input id="nombre" name="nombre" type="text" maxlength="40" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="go" placeholder="Tu nombre" aria-describedby="nota">
      <span id="cursor" aria-hidden="true"></span>
      <button type="submit" aria-label="Convertir en estrellas"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5l2.7 6.1 6.6.6-5 4.4 1.5 6.5L12 16.8 6.2 20.1l1.5-6.5-5-4.4 6.6-.6z"/></svg></button>
    </div>
  </form>
  <p id="nota">Cada nombre da siempre el mismo animal. Tu nombre no se guarda ni se envía: todo pasa en tu pantalla.</p>
  <p id="anuncio" class="sr" aria-live="polite"></p>
  <button id="sonido" type="button" aria-pressed="true" aria-label="Sonido"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path class="ondas" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
</main>
<canvas id="letras" aria-hidden="true"></canvas>
<script src="../app.js"></script>
</body>
</html>
